[project]
name = "antacia"
version = "0.0.1"
description = "Catan-compatible rules engine, RL gym and play platform for humans and bots"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["engine"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
